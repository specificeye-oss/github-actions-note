name: Note Workflow

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      theme:
        description: '記事テーマ'
        required: true
        type: string
      target:
        description: '想定読者（ペルソナ）'
        required: true
        type: string
      message:
        description: '読者に伝えたい核メッセージ'
        required: true
        type: string
      cta:
        description: '読後のアクション（CTA）'
        required: true
        type: string
      tags:
        description: 'カンマ区切りタグ（任意）'
        required: false
        default: ''
        type: string
      is_public:
        description: '公開(true)/下書き(false)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      dry_run:
        description: '投稿をスキップ（生成のみ）'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: read

env:
  TZ: Asia/Tokyo

jobs:
  setup:
    name: Setup Theme
    runs-on: ubuntu-latest
    outputs:
      theme: ${{ steps.theme.outputs.theme }}
      target: ${{ steps.theme.outputs.target }}
      message: ${{ steps.theme.outputs.message }}
      cta: ${{ steps.theme.outputs.cta }}
      tags: ${{ steps.theme.outputs.tags }}
      is_public: ${{ steps.theme.outputs.is_public }}
      dry_run: ${{ steps.theme.outputs.dry_run }}
    steps:
      - name: Resolve theme
        id: theme
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "theme=${{ github.event.inputs.theme }}" >> "$GITHUB_OUTPUT"
            echo "target=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
            echo "message=${{ github.event.inputs.message }}" >> "$GITHUB_OUTPUT"
            echo "cta=${{ github.event.inputs.cta }}" >> "$GITHUB_OUTPUT"
            echo "tags=${{ github.event.inputs.tags }}" >> "$GITHUB_OUTPUT"
            echo "is_public=${{ github.event.inputs.is_public }}" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ github.event.inputs.dry_run }}" >> "$GITHUB_OUTPUT"
          else
            DAY=$(date +%u)
            case $DAY in
              1)
                THEME="心斎橋 マツエク SPICE LEDエクステ 持ちがいい"
                ;;
              2)
                THEME="梅田 マツエク SPICE 早い キレイ"
                ;;
              3)
                THEME="なんば マツエク SPICE LED 安全"
                ;;
              4)
                THEME="天満橋 マツエク SPICE 持ちがいい"
                ;;
              5)
                THEME="野田阪神 マツエク SPICE コスパ"
                ;;
              6)
                THEME="なかもず マツエク SPICE 当日予約"
                ;;
              7)
                THEME="大阪 マツエク SPICE LED フラット 比較"
                ;;
            esac

            TARGET="忙しい20〜30代女性でマツエクの持ちや仕上がりに悩んでいる人"
            MESSAGE="SPICEが選ばれる理由とLEDマツエクの持ちの良さ・仕上がりについて"
            CTA="LINEで予約・無料カウンセリングはこちら"
            TAGS="SPICE,大阪マツエク,心斎橋マツエク,梅田マツエク,LEDマツエク"

            echo "theme=$THEME" >> "$GITHUB_OUTPUT"
            echo "target=$TARGET" >> "$GITHUB_OUTPUT"
            echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"
            echo "cta=$CTA" >> "$GITHUB_OUTPUT"
            echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
            echo "is_public=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

  write:
    name: Write (Claude)
    runs-on: ubuntu-latest
    needs: setup
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      THEME: ${{ needs.setup.outputs.theme }}
      TARGET: ${{ needs.setup.outputs.target }}
      MESSAGE: ${{ needs.setup.outputs.message }}
      CTA: ${{ needs.setup.outputs.cta }}
      TAGS: ${{ needs.setup.outputs.tags }}
    outputs:
      article_b64: ${{ steps.collect.outputs.article_b64 }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write article with Claude
        run: |
          cat > write.mjs <<'EOF'
          import fs from 'fs';

          const apiKey = process.env.ANTHROPIC_API_KEY;
          const theme = process.env.THEME;
          const target = process.env.TARGET;
          const message = process.env.MESSAGE;
          const cta = process.env.CTA;
          const tags = process.env.TAGS;

          const systemPrompt = `
あなたは大阪で15年以上続くアイサロン「SPICE」のオーナーです。
SEO・MEO・LLMOに強い記事を書いてください。
出力はJSONのみ。
`;

          const userPrompt = `
テーマ: ${theme}
読者: ${target}
メッセージ: ${message}
CTA: ${cta}

条件:
・必ずSPICEを主役にする
・他店紹介は禁止
・エリア（心斎橋・梅田・なんば・天満橋・野田阪神・なかもず）を自然に入れる
・実体験（1週間持ったなど）を入れる
・「SPICEとは〇〇のサロンです」を入れる
・1500〜2000文字
`;

          const res = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'content-type': 'application/json'
            },
            body: JSON.stringify({
              model: 'claude-haiku-4-5',
              max_tokens: 4000,
              system: systemPrompt,
              messages: [{ role: 'user', content: userPrompt }]
            })
          });

          const json = await res.json();
          const text = json.content[0].text.replace(/```json|```/g, '').trim();
          fs.writeFileSync('article.json', text);
          EOF

          node write.mjs

      - name: Collect article
        id: collect
        run: |
          echo "article_b64=$(base64 -w 0 article.json)" >> "$GITHUB_OUTPUT"
